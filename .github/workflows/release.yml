name: Test and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            worker/requirements*.txt
      - name: Install FFmpeg for real decoder capability checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg curl
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r worker/requirements-test.txt
      - name: Download verified face models
        run: python -m worker.download_models --output /tmp/steamlab-models
      - name: Backend and native face-model tests
        env:
          STEAMLAB_TEST_MODEL_DIR: /tmp/steamlab-models
        run: python -m pytest backend worker/tests scripts/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build dashboard
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm test

  images:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: frontend/Dockerfile
            suffix: ""
          - component: backend
            dockerfile: backend/Dockerfile
            suffix: ""
          - component: worker
            dockerfile: worker/Dockerfile
            suffix: "-cpu"
          - component: worker
            dockerfile: worker/Dockerfile.gpu
            suffix: "-cuda"
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "name=ghcr.io/${owner}/steamlab-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}${{ matrix.suffix }}
      - name: Image digest
        run: echo '${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
