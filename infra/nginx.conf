# Loaded as /etc/nginx/conf.d/default.conf in the frontend's nginx image.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 3m;
    client_body_timeout 30s;
    send_timeout 1h;
    # Do not retain request URLs, cookies, or stream query credentials.
    access_log off;
    error_log /dev/stderr error;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Apply at server level so all locations retain every security header.
    add_header Cache-Control "no-store" always;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api { return 404; }
    location = /health { return 404; }
    location ~ /\. { return 404; }

    location ^~ /api/ {
        # Re-resolve after backend recreation. Explicit request_uri retains the
        # full /api path and query string, including HLS and download parameters.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Only the static login/application shell is public. Private content is API-only.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
